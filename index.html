<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hot Breccia Project - 3D walkthrough (DRAFT)</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="labels"></div>

      <header id="title">
        <h1>Hot Breccia Project</h1>
        <p>3D walkthrough · Blade Resources (CSE: AZCU)</p>
      </header>

      <details id="panel" open aria-label="Map controls">
        <summary>Layers and controls</summary>
        <label class="layer"><input type="checkbox" id="t-imagery" checked /><span>Aerial imagery<small id="m-imagery"></small></span></label>
        <label class="layer"><input type="checkbox" id="t-collars" checked /><span>Historical drill holes<small id="m-collars"></small></span></label>
        <div class="legend" id="g-collars"></div>
        <label class="layer"><input type="checkbox" id="t-report" checked /><span>Surface samples (report)<small id="m-report"></small></span></label>
        <div class="legend" id="g-report"></div>
        <label class="layer"><input type="checkbox" id="t-website" /><span>Surface samples (Prismo website)<small id="m-website"></small></span></label>
        <label class="layer"><input type="checkbox" id="t-claims" checked /><span id="l-claims">Claims<small id="m-claims"></small></span></label>
        <p class="layer-note" id="m-terrain"></p>
        <h2>Vertical exaggeration</h2>
        <div class="row"><input type="range" id="exag" min="1" max="3" step="0.5" value="1" aria-label="Vertical exaggeration" /><output id="exag-val">1×</output></div>
        <button id="reset" type="button">Reset view</button>
      </details>

      <div id="exag-badge" hidden></div>

      <aside id="info" hidden aria-live="polite">
        <button id="info-close" type="button" aria-label="Close">×</button>
        <div id="info-body"></div>
      </aside>

      <div id="north" title="North arrow"><div id="north-arrow"><span>N</span></div></div>
      <div id="scale"><div id="scale-bar"></div><span id="scale-label"></span></div>
      <div id="readout">Move the pointer over the terrain</div>

      <footer id="footer">
        <strong>DRAFT, not reviewed by the Qualified Person</strong>
        <span id="credits"></span>
      </footer>

      <div id="loading">Loading terrain…</div>

      <div id="disclaimer" role="dialog" aria-modal="true" aria-labelledby="disc-title">
        <div class="disc-card">
          <h2 id="disc-title">Disclaimer</h2>
          <div id="disc-text"></div>
          <button id="disc-ok" type="button">Continue</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
